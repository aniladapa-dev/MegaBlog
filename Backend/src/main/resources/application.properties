spring.application.name=backend
server.port=8080

# Import .env configuration natively
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/megablog}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true

# Multipart file upload configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File upload directory configuration
file.upload-dir=uploads

# JWT Security Configurations
jwt.secret=${JWT_SECRET}

jwt.expiration=86400000

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Frontend Redirect Callback (production frontend URL)
app.oauth2.frontend-redirect-url=${FRONTEND_REDIRECT_URL:http://localhost:5173/oauth2/callback}

# Debug logging for Spring Security
logging.level.org.springframework.security=DEBUG

